# IANA timezone name. The cadence, the search window, and the tracker's dates all use it.
timezone = "America/New_York"

# Time of day ("HH:MM", 24-hour, in the timezone above) after which the day's searches run.
run_at = "07:00"

# The most postings one search returns: the best fits it can verify. Required.
# Each scheduled search is its own run, so a day with two searches can add up to
# twice this many. A run returns fewer when fewer pass, and the pipeline's own
# liveness check can drop some of what the agent returns.
results_per_run = 10

# Each weekday lists its searches in run order. A day left out runs nothing.
# search_family names a folder under search/ (not "shared"), whose fragments the search uses.
# agent is "perplexity", "claude", or "gemini"; window_hours looks back from the run.
# Each search family's windows together cover the week, so no hours go unsearched.
[schedule]
monday    = [
  { search_family = "analytics", agent = "perplexity", window_hours = 72 },
  { search_family = "charter", agent = "claude", window_hours = 72 },
]
tuesday   = [{ search_family = "analytics", agent = "perplexity", window_hours = 24 }]
wednesday = [{ search_family = "charter", agent = "claude", window_hours = 48 }]
thursday  = [{ search_family = "analytics", agent = "perplexity", window_hours = 48 }]
friday    = [
  { search_family = "analytics", agent = "perplexity", window_hours = 24 },
  { search_family = "charter", agent = "gemini", window_hours = 48 },
]

[runners.claude]
# Any Claude model that accepts an effort setting will run: the pipeline checks every posting's
# liveness itself, so this choice trades cost against the quality of what is found.
# We recommend an Opus model at effort "high" or above. Lower effort makes fewer tool
# calls, which shows up as more postings dropped `not_on_index` in your run summaries.
model  = "claude-opus-5-5"
effort = "high"

# Perplexity and Gemini have no settings: Perplexity always runs the "xhigh" effort, and
# Gemini the "deep-research-preview-04-2026" agent.

[verification]
# Which postings the pipeline admits. Required.
#   "strict"       only Greenhouse, Lever, Ashby, and Rippling postings, each checked
#                  against the employer's job index and the search window.
#   "best_effort"  also postings on any other employer page (Workday, iCIMS, custom
#                  careers sites). The pipeline checks those pages for signs the job
#                  closed, and checks the posted date when the page publishes one, but
#                  a page can stay up after its job closes, so expect some dead links.
#                  Run summaries count these postings as `reachable`/`reachable_no_date`.
mode = "strict"
