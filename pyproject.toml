[project]
name = "jsa"
version = "0.1.0"
description = "Job Search Agent"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "markdownify>=1.2.3",
    "prompt-toolkit>=3.0.53",
    "python-dotenv",
    "turso-serverless",
]

[project.scripts]
jsa = "jsa.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
extend-select = ["UP", "DTZ"]
